# Perception parameters. Values marked "tuned" were set on L0 previews.
box_detector:
  model: IDEA-Research/grounding-dino-tiny
  prompt: "a cardboard box."
  box_threshold: 0.30                # groundingdino defaults (model card)
  text_threshold: 0.25
  nms_iou: 0.5                       # drop near-duplicate detections
  container_min_children: 2          # drop a detection that contains >= 2 other detections (a box around the group)
  container_overlap: 0.8             # "contains" = >= 80 % of the child's area inside
head_depth:                          # where the head depth image comes from (perception/stereo_depth.py)
  # source (stereo: own matching on the infrared pair | render: the camera's delivered depth, simulator render) is set
  # per head camera: robot.yaml head_camera.<model>.depth_source (D435i: stereo; upstream single camera: render)
  valid_range_m: [0.3, 3.0]          # D435i: min-Z ~0.3 m at 848 x 480 (G1 depth camera spec 0.4 m), ideal range to 3 m
  disparity_sigma_px: 0.20           # measured: robust std of the disparity error vs the render depth, 0.18-0.22 px over
                                     # 10 frames at 0.6-2.5 m (2026-11-13, g1_barcode_sim scripts/d435i_check.py); depth noise
                                     # sigma_z = 0.20 px x z^2 / (f B) -> 0.9 cm at 1 m, 3.5 cm at 2 m
  sgbm:                              # OpenCV StereoSGBM. Hand-chosen from OpenCV's documented defaults / usual values:
    num_disparities: 80              # >= f x B / near limit = 447 px x 0.05 m / 0.3 m = 74.5 px, multiple of 16
    block_size: 7                    # matching window (odd); several projector dots fall inside one window
    p1_per_px: 8                     # P1 = 8 x block^2, P2 = 32 x block^2 (OpenCV sample values for 1-channel images)
    p2_per_px: 32
    uniqueness_ratio: 10             # OpenCV: "5-15 is good enough"
    speckle_window: 100              # OpenCV: "50-200"
    speckle_range: 2                 # OpenCV: "1 or 2 is good enough"
    disp12_max_diff: 1               # left-right consistency check, px
    prefilter_cap: 63
    mode: 3way
plane_fit:
  depth_valid: [0.2, 3.0]            # head depth valid range (camera spec, same as the simulator)
  stride: 2                          # pixel subsampling inside the detection box
  ransac_iters: 400
  inlier_dist: 0.01                  # m (noise-free depth; stereo: max(this, inlier_sigmas x sigma_z), plane_fit.py)
  inlier_sigmas: 2.0                 # stereo depth: point-to-plane tolerance in depth-noise sigmas (~95 % of a normal error)
  max_normal_tilt_deg: 20.0          # front face: normal within 20 deg of horizontal
  min_inliers: 150
  seed: 0
fov_margin_frac: 0.05                # face corners inside the head image with a 5 % border
wall_layout:                         # wall-layout task, strip mode (scan_targets.order "strips"; toolbox _strip_delta)
  edge_bias_px: 10.3                 # outward bias of ONE side edge of the wall in the head stereo depth (px), used for the
                                     # lateral margin of a one-edge registration: delta_edge = this x edge depth / fx.
                                     # Source (design scanroom_strip_design.md 5.1): run-1 two-edge width residual
                                     # r = 0.020 m at 1.2 m (fx 616.9: 10.3 px), both edges fattened outward; SGBM repro
                                     # 0.013-0.020 m per edge at 1.2 m (6.7-10.3 px, the largest kept); label-derived
                                     # bias 7-9 px at stance depth
barcode:
  roi_pad_frac: 0.05                 # face ROI padding in the image
  upscale: 3                         # head-camera ROI is upsampled before detection (labels are ~20-40 px wide)
  # head camera (fx 243 px): an 8 cm code128 at 0.8 m spans ~24 px (< 0.2 px per module), cv2.barcode found 0/42
  # (default params) and at most 5/18 (tuned) on t2 previews -> labels are localised with GroundingDINO on the
  # upsampled box crop (13/13 on the same previews), then refined with cv2 detectors when they succeed
  label_prompt: "a barcode label."
  label_threshold: 0.25              # box threshold for the label prompt. 2026-11-07, 14 captured head views (plain + printed
                                     # stacks): labels 0.25-0.72 (printed boxes 0.25-0.51: 0.35 lost 3 of 5), non-labels
                                     # (whole box faces) <= 0.20; enclosing boxes are dropped in detect_label_dino
  label_max_area_frac: 0.5           # a "label" covering > 50 % of the box crop is the face itself
  wrist_upscale: 1                   # hand-camera image (detection and symbol-width decode): g1_v1's hand camera is the
                                     # scanner imager (fx 1087 px), which resolves the bars directly; a robot variant
                                     # overrides it (robot.yaml variants.<v>.perception: g1_v2 D405 -> 2)
  wrist_decode_rotation_step_deg: 15 # symbol width from the hand-camera image (refine_with_wrist): zbar decodes 1-D codes only
                                     # within ~+-17 deg of an image axis -> rotations 0..75; same value and evidence as the
                                     # simulator's scanner (g1_barcode_sim configs/scanner.yaml scan.rotation_step_deg)
